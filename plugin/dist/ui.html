<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #2c2c2c;
  color: #fff;
  font-size: 12px;
}
#root { height: 100%; display: flex; flex-direction: column; }
button { font-family: inherit; }

.scroll::-webkit-scrollbar { width: 9px; height: 9px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 6px; border: 2px solid #2c2c2c; }
.scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.24); }
.scroll::-webkit-scrollbar-track { background: transparent; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

input::placeholder { color: #6b6b6b; }
input:focus { outline: none; border-color: #0d99ff !important; }

/* ===== Title bar ===== */
.titlebar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px 0 14px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.titlebar .logo {
  width: 22px; height: 22px; border-radius: 6px;
  background: linear-gradient(135deg, #0d99ff, #7b61ff);
  display: flex; align-items: center; justify-content: center; flex: none;
}
.titlebar .title { font-size: 12px; font-weight: 600; letter-spacing: -0.1px; }
.titlebar .badge { font-size: 11px; color: #6b6b6b; font-weight: 450; }
.titlebar .spacer { flex: 1; }
.iconbtn {
  width: 28px; height: 28px; border-radius: 6px; border: none;
  background: transparent; color: #b3b3b3;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.iconbtn:hover { background: rgba(255,255,255,0.08); color: #fff; }

/* ===== Stepper ===== */
.stepper {
  height: 52px;
  flex: none;
  display: flex;
  align-items: center;
  padding: 0 18px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.stepper .line {
  height: 1.5px;
  flex: 1;
  margin: 0 8px;
  border-radius: 2px;
}
.stepper .step { display: flex; align-items: center; gap: 7px; flex: none; }
.stepper .circle {
  width: 21px; height: 21px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; flex: none;
}
.stepper .label { font-size: 11px; font-weight: 600; letter-spacing: -0.1px; }

/* ===== Content scroll area ===== */
.content { flex: 1; overflow-y: auto; overflow-x: hidden; }
.step-pad { padding: 22px 20px 24px; }

.h-title { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; margin-bottom: 4px; }
.h-sub { font-size: 11.5px; color: #999; line-height: 1.5; margin-bottom: 18px; }
.mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

/* ===== Source segmented (MVP: single tab) ===== */
.seg {
  display: flex; gap: 3px; padding: 3px;
  background: #1e1e1e; border-radius: 8px; margin-bottom: 20px;
}
.seg button {
  flex: 1; display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 7px 0; border-radius: 5px;
  font-size: 11.5px; font-weight: 600; cursor: pointer; border: none;
  background: #0d99ff; color: #fff;
}

/* ===== Upload card ===== */
.dropzone {
  border: 1.5px dashed rgba(255,255,255,0.18);
  border-radius: 10px;
  background: #262626;
  padding: 30px 20px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  cursor: pointer;
}
.dropzone:hover, .dropzone.drag {
  border-color: rgba(13,153,255,0.5);
  background: #282b2e;
}
.dropzone .icon {
  width: 42px; height: 42px; border-radius: 10px;
  background: rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
}
.dropzone .primary { font-size: 12.5px; font-weight: 600; margin-bottom: 3px; }
.dropzone .secondary { font-size: 11px; color: #999; }
.dropzone .secondary .link { color: #5cb8ff; font-weight: 600; }
.dropzone input[type="file"] { display: none; }

.detected {
  margin-top: 14px;
  padding: 11px 13px;
  background: #242424;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  display: flex; align-items: center; gap: 9px;
}
.detected .badge {
  width: 20px; height: 20px; border-radius: 5px;
  background: rgba(20,174,92,0.16);
  display: flex; align-items: center; justify-content: center; flex: none;
}
.detected .text { font-size: 11.5px; }
.detected .text b { font-weight: 600; }
.detected .text .dim { color: #6b6b6b; }

/* ===== Step 2: file groups ===== */
.group-header {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 7px; padding-left: 2px;
}
.group-header .name {
  font-size: 11px; font-weight: 700; color: #9a9a9a;
  letter-spacing: 0.3px;
}
.file-list { display: flex; flex-direction: column; gap: 5px; }
.file-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px;
  border-radius: 8px; cursor: pointer;
  background: #242424;
  border: 1px solid rgba(255,255,255,0.07);
}
.file-row.checked {
  background: rgba(13,153,255,0.07);
  border-color: rgba(13,153,255,0.35);
}
.file-row .box {
  width: 17px; height: 17px; border-radius: 5px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  box-shadow: inset 0 0 0 1.5px #666;
}
.file-row.checked .box { background: #0d99ff; box-shadow: inset 0 0 0 1.5px #0d99ff; }
.file-row .name {
  flex: 1; min-width: 0;
  font-size: 12px; font-weight: 500;
}
.file-row .count {
  font-size: 10px; color: #8a8a8a;
  background: rgba(255,255,255,0.06);
  padding: 2px 7px; border-radius: 10px; font-weight: 600; flex: none;
}

/* ===== Step 3: stats + preview ===== */
.stats { display: flex; gap: 8px; margin-bottom: 18px; }
.stat {
  flex: 1; background: #242424;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 9px; padding: 11px 12px;
}
.stat .n { font-size: 19px; font-weight: 700; letter-spacing: -0.5px; }
.stat .l { font-size: 10px; color: #8a8a8a; font-weight: 500; margin-top: 1px; }

.collection {
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; overflow: hidden;
  margin-bottom: 18px;
}
.collection-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; background: #303030;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.collection-head .n { font-size: 12px; font-weight: 700; }
.collection-head .spacer { flex: 1; }
.collection-head .modes { font-size: 10px; color: #8a8a8a; font-weight: 500; }
.collection-head .count {
  font-size: 10px; color: #8a8a8a;
  background: rgba(255,255,255,0.06);
  padding: 2px 7px; border-radius: 10px; font-weight: 600;
}
.var-row {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.045);
}
.var-row:last-child { border-bottom: none; }
.var-row .swatch {
  width: 15px; height: 15px; border-radius: 4px; flex: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
}
.var-row .hash {
  width: 15px; height: 15px; border-radius: 4px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.07); color: #8a8a8a;
  font-size: 10px; font-weight: 700;
}
.var-row .n {
  font-size: 11.5px; font-weight: 500; color: #d8d8d8;
  flex: none; min-width: 124px;
}
.var-row .spacer { flex: 1; }
.var-row .v {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 500; color: #b8b8b8;
}
.var-row .v .swatch-sm {
  width: 13px; height: 13px; border-radius: 3px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
}

/* ===== Step 4: running / done ===== */
.run-center { text-align: center; padding: 8px 0 18px; }
.run-spinner { display: inline-flex; width: 46px; height: 46px; margin-bottom: 14px; }
.run-title { font-size: 14px; font-weight: 700; }
.run-pct { font-size: 11px; color: #8a8a8a; margin-top: 3px; }
.progressbar {
  height: 6px; background: #1e1e1e; border-radius: 4px;
  overflow: hidden; margin-bottom: 18px;
}
.progressbar .fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, #0d99ff, #7b61ff);
  width: 0%; transition: width 0.18s ease;
}

.done-center { text-align: center; padding: 8px 0 20px; }
.done-icon {
  width: 50px; height: 50px; border-radius: 50%;
  background: rgba(20,174,92,0.16);
  display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: 13px; animation: fadeIn 0.3s ease;
}
.done-title { font-size: 15px; font-weight: 700; }
.done-sub { font-size: 11.5px; color: #8a8a8a; margin-top: 3px; }

.done-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 18px;
}
.done-stats .cell {
  background: #242424;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 9px; padding: 12px 13px;
  display: flex; align-items: center; gap: 10px;
}
.done-stats .cell .big {
  font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
}
.done-stats .cell .lbl {
  font-size: 11px; color: #b3b3b3; line-height: 1.3;
}

.console-label {
  font-size: 10px; font-weight: 700; color: #707070;
  letter-spacing: 0.5px; margin-bottom: 8px;
}
.console {
  background: #181818;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 9px;
  padding: 11px 13px;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 10.5px; line-height: 1.85;
  min-height: 100px;
  max-height: 240px;
  overflow-y: auto;
}
.console .ln { display: flex; gap: 8px; }
.console .ln .arr { color: #555; }
/* Long messages wrap instead of clipping — errors must stay fully readable. */
.console .ln span:last-child { min-width: 0; overflow-wrap: anywhere; }

/* ===== Footer ===== */
.footer {
  flex: none; min-height: 56px;
  border-top: 1px solid rgba(255,255,255,0.07);
  padding: 11px 16px;
  display: flex; align-items: center; gap: 10px;
}
.footer .spacer { flex: 1; }
.footer .selcount { font-size: 11px; color: #8a8a8a; margin-right: 2px; }
.footer .info { font-size: 11.5px; color: #8a8a8a; font-weight: 500; }
.btn {
  height: 32px; padding: 0 14px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.14);
  background: transparent; color: #e6e6e6;
  font-size: 11.5px; font-weight: 600; cursor: pointer;
}
.btn:hover { background: rgba(255,255,255,0.06); }
.btn.primary {
  border: none; background: #0d99ff; color: #fff; padding: 0 16px;
}
.btn.primary:hover { background: #0a85e0; }
.btn.primary[disabled] {
  background: #3a3a3a; color: #777; cursor: not-allowed;
}

/* ===== Mode chips on the collection header (Step 3) ===== */
.collection-head .mode-chips {
  display: inline-flex; gap: 4px; margin-right: 6px;
}
.mode-chip {
  font-size: 9.5px; font-weight: 600; letter-spacing: 0.2px;
  color: #b9a6ff;
  background: rgba(123, 97, 255, 0.14);
  padding: 2px 6px; border-radius: 9px;
}

/* ===== Inline mode tag inside variable values ===== */
.var-row .v .mode-tag {
  font-size: 9.5px; font-weight: 700;
  color: #8a8a8a;
  background: rgba(255,255,255,0.06);
  padding: 1px 5px; border-radius: 4px;
  margin-right: 3px;
}
.var-row .v .alias-ref {
  color: #b9a6ff; font-weight: 500;
}

/* ===== Warnings panel (Step 3) ===== */
.warnings {
  margin-top: 8px;
  padding: 11px 13px;
  background: rgba(255, 139, 139, 0.06);
  border: 1px solid rgba(255, 139, 139, 0.18);
  border-radius: 8px;
}
.warnings-head {
  font-size: 11px; font-weight: 700; color: #ff8b8b; margin-bottom: 6px;
}
.warning-ln {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 10.5px; color: #c4c4c4; line-height: 1.5;
}
/* Notices: nothing was lost, so the panel is muted, not red. */
.warnings.notes {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.08);
}
.warnings.notes .warnings-head { color: #999; }

/* ===== Settings sheet ===== */
.sheet-overlay {
  position: absolute; inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex; align-items: stretch; justify-content: flex-end;
  z-index: 50;
  animation: fadeIn 0.15s ease;
}
.sheet {
  width: 400px;
  max-width: 100%;
  background: #2c2c2c;
  border-left: 1px solid rgba(255,255,255,0.07);
  display: flex; flex-direction: column;
  box-shadow: -8px 0 20px rgba(0,0,0,0.35);
}
.sheet-head {
  flex: none;
  height: 44px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px 0 14px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.sheet-title { font-size: 12px; font-weight: 700; letter-spacing: -0.1px; flex: 1; }
.sheet-body {
  flex: 1; overflow-y: auto;
  padding: 18px 18px 22px;
  display: flex; flex-direction: column; gap: 18px;
}
.settings-row {
  display: flex; flex-direction: column; gap: 10px;
}
.settings-meta { display: flex; flex-direction: column; gap: 3px; }
.settings-h { font-size: 12px; font-weight: 700; }
.settings-sub { font-size: 11px; color: #999; line-height: 1.5; }

.seg-settings {
  display: flex; gap: 3px; padding: 3px;
  background: #1e1e1e; border-radius: 8px;
}
.seg-settings .seg-btn {
  flex: 1; display: flex; align-items: center; justify-content: center;
  gap: 5px; padding: 7px 10px; border-radius: 5px;
  font-size: 11px; font-weight: 600; cursor: pointer; border: none;
  background: transparent; color: #b3b3b3;
}
.seg-settings .seg-btn:hover { color: #fff; }
.seg-settings .seg-btn.active {
  background: #0d99ff; color: #fff;
}

.toggle {
  width: 36px; height: 20px; border-radius: 11px;
  background: #3a3a3a; border: none; padding: 0;
  position: relative; cursor: pointer; flex: none;
}
.toggle .knob {
  position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: left 0.15s ease;
}
.toggle.on { background: #0d99ff; }
.toggle.on .knob { left: 18px; }

.theme-block {
  display: flex; flex-direction: column; gap: 8px;
  padding-top: 4px;
  border-top: 1px solid rgba(255,255,255,0.07);
}
.theme-row {
  background: #242424;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 8px;
  padding: 9px 11px;
  display: flex; flex-direction: column; gap: 5px;
}
.theme-row-head { font-size: 11px; }
.theme-collection { font-weight: 700; color: #fff; }
.theme-dir { color: #8a8a8a; }
.theme-mode {
  display: flex; align-items: center; gap: 8px;
  font-size: 10.5px;
}
.theme-mode-name {
  color: #b9a6ff; font-weight: 600;
  background: rgba(123, 97, 255, 0.14);
  padding: 1px 6px; border-radius: 8px;
}
.theme-mode-file { color: #8a8a8a; }
</style>
</head>
